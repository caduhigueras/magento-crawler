[package]
name = "magento_crawler"
version = "1.1.0"
edition = "2024"
repository = "https://github.com/caduhigueras/magento-crawler"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "magento_crawler"

[dependencies]
tokio = { version = "1.47.1", features = ["time", "rt", "rt-multi-thread", "macros", "fs", "sync", "io-util", "net", "signal"] }
reqwest = { version = "0.12.22", features = ["gzip"] }
log = "0.4.27"
dotenv = "0.14.1"
csv = "1.3.1"
serde = { version = "1.0.219", features = ["derive"] }
futures = "0.3.31"
clickhouse = { version = "0.13.3", features = ["chrono", "inserter"] }
chrono = { version = "0.4.41", default-features = false }
serde_json = "1.0.48"
clap = { version = "4.5.41", features = ["derive"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
config = "0.15.19"
serde-aux = "4.7.0"
dirs = "6.0.0"
lettre = { version = "0.11.19", features = ["sendmail-transport"] }
secrecy = { version = "0.10.3", features = ["serde"] }
axum = "0.8.4"
tower-http = { version = "0.6.6", features = ["decompression-gzip"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
flate2 = "1"
tower = { version = "0.5", features = ["util"] }
